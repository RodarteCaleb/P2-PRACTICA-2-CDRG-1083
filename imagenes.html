<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Indica el inicio del documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Imagenes en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todos los elementos visibles de la página -->

    <h2>Imagenes en HTML</h2>
    <!-- Define un encabezado de segundo nivel -->

    <h3>Locales</h3>
    <!-- Define un encabezado de tercer nivel para las imágenes almacenadas localmente -->

    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- <img> permite insertar una imagen. src indica la ubicación de la imagen y alt proporciona un texto alternativo -->

    <h3>Locales redismensionado</h3>
    <!-- Define un encabezado para las imágenes locales con un tamaño modificado -->

    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!-- src indica la ubicación de la imagen, width establece el ancho y height establece la altura -->

    <h3>Desde internet</h3>
    <!-- Define un encabezado para una imagen obtenida desde internet -->

    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!-- La imagen se obtiene mediante una dirección URL de internet y se establece su ancho y altura -->

    <h3>Animaciones</h3>
    <!-- Define un encabezado para mostrar una imagen animada -->

    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    <!-- La imagen animada se obtiene desde internet y se establece su ancho y altura -->

</body>
<!-- Indica el final del contenido visible de la página -->

</html>
<!-- Indica el final del documento HTML -->
