<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Indica el inicio del documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Salto de linea en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene los elementos visibles de la página -->

    <h1>Lenguaje de programacion</h1>
    <!-- Define el encabezado principal de la página -->

    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        <!-- La etiqueta <br> realiza un salto de línea -->

        Dart<br>
        <!-- <br> hace que el siguiente contenido aparezca en una nueva línea -->

        Flutter<br>
        <!-- Realiza un salto de línea -->

        Python<br>
        <!-- Realiza un salto de línea -->

        Ruby<br>
        <!-- Realiza un salto de línea -->

        Java<br>
        <!-- Realiza un salto de línea -->

        TypeScript<br>
        <!-- Realiza un salto de línea -->

        Entre otros.
        <!-- Texto final del párrafo -->
    </p>
    <!-- Indica el final del párrafo -->

</body>
<!-- Indica el final del contenido visible de la página -->

</html>
<!-- Indica el final del documento HTML -->
