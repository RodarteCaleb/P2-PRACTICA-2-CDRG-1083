<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en">
<!-- Indica el inicio del documento HTML -->

<head>
    <!-- Contiene información y configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Enlaces en HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todos los elementos visibles de la página -->

    <h2>Tipos de enlaces en HTML</h2>
    <!-- Define un encabezado de segundo nivel -->

    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!-- <p> crea un párrafo y <strong> muestra el texto con énfasis fuerte, normalmente en negritas -->

    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- <a> crea un enlace. href indica la página a la que dirige y <br> realiza un salto de línea -->

    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- target="_self" abre el enlace en la misma ventana o pestaña -->

    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!-- target="_blank" abre el enlace en una nueva pestaña o ventana -->

    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!-- target="_parent" abre el enlace en el contexto o marco padre -->

    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <!-- target="_top" abre el enlace en el contexto superior de la ventana -->

    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <!-- Indica el inicio de la sección de enlaces hacia sitios externos -->

    <a href="https://www.google.com/">Google</a><br>
    <!-- Enlace hacia el sitio externo de Google -->

    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <!-- Enlace hacia YouTube que se abre en la misma ventana o pestaña -->

    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <!-- Enlace hacia Facebook que se abre en una nueva pestaña o ventana -->

    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <!-- Enlace hacia Wikipedia que se abre en el contexto o marco padre -->

    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
    <!-- Enlace hacia Yahoo que se abre en el contexto superior de la ventana -->

</body>
<!-- Indica el final del contenido visible de la página -->

</html>
<!-- Indica el final del documento HTML -->
